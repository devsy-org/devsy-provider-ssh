name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      core_tag:
        description: >-
          Core release tag to qualify with this provider checkout (for example
          v1.25.0-beta.8). Runs the release-qualification job.
        required: false
        type: string
      provider_tag:
        description: Published SSH provider release to qualify
        required: true
        default: v1.1.47
        type: string

jobs:
  test:
    name: Integration tests (compatibility core v1.24.0, not release qualification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: install login shells
        run: sudo apt-get update && sudo apt-get install -y bash zsh fish openssh-server

      - name: unit tests
        run: go test -race -covermode=atomic . ./cmd/... ./hack/... ./pkg/...
        env:
          CGO_ENABLED: "1"

      - name: disk usage before snapshot
        run: |
          df -h /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          du -sh "$(go env GOCACHE)" "$(go env GOMODCACHE)"

      - name: build snapshot artifacts
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --parallelism=1

      - name: disk usage after snapshot
        if: always()
        run: |
          df -h /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          du -sh "$(go env GOCACHE)" "$(go env GOMODCACHE)"

      - name: provision login shell accounts
        run: |
          sudo service ssh start
          for shell in bash zsh fish; do
            sudo useradd --create-home --shell "$(command -v "$shell")" "devsy-$shell"
          done

      - name: integration tests
        working-directory: ./e2e
        run: go test -v -ginkgo.v -timeout 3600s --ginkgo.label-filter=integration
        env:
          DEVSY_E2E_SHELL_MATRIX: "true"

  windows-stdin:
    name: Windows redirected SSH stdin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: test redirected pipe bytes and cancellation
        run: go test ./pkg/ssh -run TestWindows -timeout 60s

  release-qualification:
    name: Release qualification (${{ matrix.core_artifact }}, explicit pair)
    if: github.event_name == 'workflow_dispatch' && inputs.core_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        core_artifact: [cli, desktop]
    permissions:
      contents: read
    env:
      CORE_TAG: ${{ inputs.core_tag }}
      CORE_REPO: devsy-org/devsy
      PROVIDER_TAG: ${{ inputs.provider_tag }}
      CORE_ARTIFACT: ${{ matrix.core_artifact }}
      PROVIDER_FIX_SHA: d31fed1b2695861b76e922c530ad8a2436f5acb9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: choose the qualification artifact directory
        run: echo "QUALIFICATION_DIR=$RUNNER_TEMP/qualification" >> "$GITHUB_ENV"

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: resolve and verify the candidate core
        run: go run ./hack/ci qualify-core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: install login shells
        run: sudo apt-get update && sudo apt-get install -y bash zsh fish openssh-server

      - name: download and verify the released provider
        run: |
          set -euo pipefail
          mkdir -p dist/build_linux_amd64_v1
          asset=devsy-provider-ssh-linux-amd64
          gh release download "$PROVIDER_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir dist/build_linux_amd64_v1 --clobber
          gh release download "$PROVIDER_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --dir dist --clobber
          binary="dist/build_linux_amd64_v1/$asset"
          digest="$(sha256sum "$binary" | cut -d' ' -f1)"
          published_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROVIDER_TAG" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          if [ "$published_digest" != "sha256:$digest" ]; then
            echo "::error::downloaded provider sha256:$digest differs from '$published_digest'"
            exit 1
          fi
          chmod 0755 "$binary"
          echo "provider binary sha256: $digest (matches published release digest)" \
            | tee -a "$QUALIFICATION_DIR/pair-verification.txt" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: require the explicit candidate before SSH setup
        working-directory: ./e2e
        run: |
          status=0
          env -u DEVSY_E2E_BINARY go test -v -timeout 300s --ginkgo.v \
            --ginkgo.label-filter=release-qualification \
            --ginkgo.focus='bash builtin=false installs a cold agent by remote download' \
            > "$QUALIFICATION_DIR/missing-binary-guard.log" 2>&1 || status=$?
          cat "$QUALIFICATION_DIR/missing-binary-guard.log"
          test "$status" -eq 1
          grep -F 'DEVSY_E2E_BINARY is required' "$QUALIFICATION_DIR/missing-binary-guard.log"
        env:
          DEVSY_E2E_RELEASE_QUALIFICATION: "true"

      - name: provision login shell accounts
        run: |
          sudo service ssh start
          for shell in bash zsh fish; do
            sudo useradd --create-home --shell "$(command -v "$shell")" "devsy-$shell"
            sudo usermod --append --groups docker "devsy-$shell"
          done
          sudo useradd --create-home --shell "$(command -v bash)" --groups docker devsy-sudo
          policy=/etc/sudoers.d/devsy-e2e-qualification
          sudo test ! -e "$policy"
          rule="$(mktemp)"
          trap 'rm -f "$rule"' EXIT
          printf '%s\n' 'devsy-sudo ALL=(root) NOPASSWD: SETENV: /bin/sh -c * devsy-install *' > "$rule"
          sudo visudo -cf "$rule"
          echo "DEVSY_SUDO_FIXTURE_POLICY=$policy" >> "$GITHUB_ENV"
          sudo install -m 0440 -o root -g root "$rule" "$policy"
          sudo visudo -cf "$policy"

      - name: qualify login shells with the explicit pair
        working-directory: ./e2e
        run: >-
          go test -v -ginkgo.v -timeout 14400s
          --ginkgo.label-filter='release-qualification || provider-command'
        env:
          DEVSY_E2E_RELEASE_QUALIFICATION: "true"
          DEVSY_E2E_SHELL_MATRIX: "true"
          DEVSY_E2E_REPORT: ${{ runner.temp }}/qualification/qualification-report.json

      - name: remove owned sudo fixture policy
        if: always() && env.DEVSY_SUDO_FIXTURE_POLICY != ''
        run: sudo rm -f -- "$DEVSY_SUDO_FIXTURE_POLICY"

      - name: require a complete, passing report
        run: |
          jq -e --arg sha "$CORE_SHA256" '
            .pair.coreBinarySha256 == $sha
            and (.cells | length == 6)
            and ([.cells[] | [.shell, .builtinSsh]] | unique | length == 6)
            and all(.cells[];
              .cleanup == "ok"
              and (.scenarios | length == 5)
              and all(.scenarios[]; .outcome == "passed")
              and (.agentDir | contains(" ") and contains("\u0027")
                and contains("\\") and contains("$") and contains("\u03bb"))
              and .agentSha256.download == $sha
              and .agentSha256.stdin == $sha)
            and .privilege.user == "devsy-sudo"
            and .privilege.userUid > 0
            and .privilege.directoryState == "0:755"
            and .privilege.writeDenied == true
            and .privilege.agentUid == 0
            and .privilege.agentVersion == .pair.coreVersion
            and .privilege.agentSha256 == $sha
            and .privilege.liveCommand == true
            and .privilege.outcome == "passed"
            and .privilege.cleanup == "ok"
          ' "$QUALIFICATION_DIR/qualification-report.json"

      - name: upload qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qualification-${{ inputs.core_tag }}-${{ matrix.core_artifact }}
          path: |
            ${{ runner.temp }}/qualification/pair-verification.txt
            ${{ runner.temp }}/qualification/qualification-report.json
            ${{ runner.temp }}/qualification/missing-binary-guard.log
          if-no-files-found: error
