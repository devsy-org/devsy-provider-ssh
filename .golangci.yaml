version: "2"
run:
  timeout: 5m
  concurrency: 8
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
linters:
  enable:
    - cyclop
    - decorder
    - dupl
    - errcheck
    - fatcontext
    - forbidigo
    - funcorder
    - funlen
    - goconst
    - gocritic
    - godot
    - gosec
    - lll
    - misspell
    - modernize
    - nestif
    - revive
    - staticcheck
    - unparam
    - unused
    - whitespace
  exclusions:
    rules:
      - path: 'hack/ci/(qualify|verify_provider)\.go'
        linters:
          - gosec
        text: 'G302: Expect file permissions to be 0600 or less'
      - path: 'hack/ci/(exec|guard)\.go'
        linters:
          - gosec
        text: 'G204|G702'
      - path: 'hack/ci/provision_test\.go'
        linters:
          - gosec
        text: 'G703'
      - path: 'e2e/qualification/report\.go'
        linters:
          - gosec
        text: 'G304'
  settings:
    cyclop:
      max-complexity: 8
    revive:
      rules:
        - name: argument-limit
          arguments: [4]
        - name: function-result-limit
          arguments: [3]
